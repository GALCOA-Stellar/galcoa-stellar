[package]
name = "escrow-entrega"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "28.0.0"
# Piezas de OpenZeppelin (MIT, auditadas): dueño con transferencia en dos pasos y pausa.
stellar-access = "=0.8.0"
stellar-contract-utils = "=0.8.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
